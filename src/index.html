<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' https: data:; frame-src https: data:;">
  <title>Project Lantern</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="chrome">
      <div class="topline">
        <button class="brand" id="brandHome" aria-label="Lantern home">
          <span class="brand-mark">L</span><b>Lantern</b><span class="beta">BETA</span>
        </button>
        <div class="tabs" id="tabs"></div>
        <button class="icon-button new-tab" id="newTab" title="New tab">+</button>
        <div class="window-spacer"></div>
      </div>
      <div class="toolbar">
        <button class="icon-button" id="back" title="Back">‹</button>
        <button class="icon-button" id="forward" title="Forward">›</button>
        <button class="icon-button" id="reload" title="Reload">↻</button>
        <button class="icon-button home-button" id="home" title="Lantern home">⌂</button>
        <form class="omnibox" id="addressForm">
          <span class="omnibox-icon">⌕</span>
          <input id="address" placeholder="Ask Lantern or enter a web address" autocomplete="off">
          <span class="safety-pill" id="safetyPill">Lantern home</span>
        </form>
        <button class="icon-button lantern-button" id="aiToggle" title="Ask Lantern">✦</button>
        <button class="profile-button" id="profileMenu" title="Profile">A</button>
      </div>
    </header>

    <main class="stage">
      <div class="progress" id="progress"></div>
      <section class="lantern-surface" id="lanternSurface">
        <nav class="app-nav" id="appNav" aria-label="Lantern sections"></nav>
        <div class="screen" id="screen"></div>
      </section>
      <div id="webArea"></div>

      <aside class="tutor-panel" id="aiPanel">
        <div class="tutor-head">
          <div class="tutor-title"><span class="mini-mark">✦</span><div><strong>Ask Lantern</strong><small id="aiState">Learning guide</small></div></div>
          <div><button class="panel-icon" id="settingsBtn" title="AI settings">⚙</button><button class="panel-icon" id="closeAI">×</button></div>
        </div>
        <div class="messages" id="messages">
          <div class="bubble lantern"><b>Lantern</b><p>I’ll help you think it through—not just hand over an answer. What are you curious about?</p></div>
        </div>
        <div class="tutor-actions">
          <button data-ai="Explain this more simply">Explain simpler</button>
          <button data-ai="Give me an example">Give an example</button>
          <button data-ai="Quiz me on this">Quiz me</button>
          <button data-ai="Help me see this visually">Show visually</button>
        </div>
        <form class="composer" id="aiForm">
          <textarea id="aiInput" rows="1" placeholder="Ask a why, how, or what-if question..."></textarea>
          <button class="send-button" id="sendAI" title="Send">↑</button>
        </form>
      </aside>

      <div class="modal-layer" id="modalLayer" role="dialog" aria-modal="true"></div>
      <div class="settings" id="settings">
        <div class="settings-card">
          <button class="settings-close" id="settingsClose">×</button>
          <span class="eyebrow">OPTIONAL CONNECTION</span>
          <h2>Lantern AI settings</h2>
          <p>The prototype teaches locally. You can also connect any OpenAI-compatible endpoint. Keys stay on this device.</p>
          <label>Endpoint<input id="endpoint" placeholder="http://localhost:11434/v1/chat/completions"></label>
          <label>Model<input id="model" placeholder="your-model"></label>
          <label>API key <span>(optional)</span><input id="apiKey" type="password" placeholder="Leave empty for local servers"></label>
          <button class="primary-button" id="saveSettings">Save settings</button>
        </div>
      </div>
      <div class="toast" id="toast"></div>
    </main>
  </div>
  <script src="lantern-data.js"></script>
  <script src="lantern-services.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
